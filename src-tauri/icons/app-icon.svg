<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="app-icon-title">
  <title id="app-icon-title">Kudos</title>
  <!-- Desktop icon source. Geometry is identical to public/brand/kudos-mark.svg. -->
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3157"/>
      <stop offset="0.52" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#05070e"/>
    </linearGradient>
    <radialGradient id="k-halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k-ink" x1="0.24" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#d3e4ff"/>
    </linearGradient>
    <linearGradient id="k-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="k-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#k-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#k-edge)" stroke-width="1.5"/>
  <circle cx="256" cy="238" r="168" fill="url(#k-halo)"/>

  <g transform="translate(7 -5)" fill="none" stroke="url(#k-ink)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 250 320 140M178 250 320 360"/>
  </g>

  <rect x="196" y="385" width="120" height="6" rx="3" fill="url(#k-accent)"/>
</svg>
